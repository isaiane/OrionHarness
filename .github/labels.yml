# Convenção de labels do Orion Harness.
# Aplicado automaticamente pelo workflow .github/workflows/labels.yml (fonte da verdade).
# Prefixos por dimensão facilitam filtros no GitHub Projects.

# --- Tipo ---
- name: "type:task"
  color: "1d76db"
  description: "Tarefa SDD (unidade LEAN)"
- name: "type:bug"
  color: "d73a4a"
  description: "Defeito / comportamento incorreto"
- name: "type:docs"
  color: "0075ca"
  description: "Documentação"
- name: "type:chore"
  color: "cfd3d7"
  description: "Manutenção / infraestrutura"

# --- Modelo de confiança (AGENTS.md §11) ---
- name: "trust:T2"
  color: "e99695"
  description: "Médio impacto / dado sensível — exige review"
- name: "trust:T3"
  color: "b60205"
  description: "Irreversível / alto risco — exige gate G3"

# --- Fluxo / governança ---
- name: "needs-triage"
  color: "ededed"
  description: "Aguardando triagem"
- name: "needs-human-approval"
  color: "5319e7"
  description: "Parada num gate humano AGORA (G1–G2); sai ao dar o gate. Não move coluna (ORION-0038)"
- name: "needs-adr"
  color: "5319e7"
  description: "Requer decisão arquitetural (ADR / G2)"
- name: "blocked"
  color: "000000"
  description: "Bloqueada por dependência externa → Blocked; sai quando a dependência resolve"
- name: "ready"
  color: "0e8a16"
  description: "G1 dado — pronta para implementar (não move coluna, ORION-0038)"
- name: "status:in-progress"
  color: "fbca04"
  description: "Implementação iniciada → board In progress (o agente aplica; ORION-0038)"
- name: "status:in-review"
  color: "0075ca"
  description: "Revisão independente solicitada → board In review (o agente aplica; ORION-0038)"
- name: "alert:flip-liveness"
  color: "b60205"
  description: "Alerta: flip-batch sem rodada bem-sucedida no prazo; owner manual reassume (ORION-0037)"
- name: "cross-model"
  color: "5319e7"
  description: "Liga o check cross-model num PR de harness: exige teste de aceite de outro modelo (ORION-0041)"
- name: "cross-model:isento"
  color: "c5def5"
  description: "Rota fora do pipeline de contrato: check cross-model não exige (justificar no PR; ORION-0041)"
- name: "pipeline:contract"
  color: "fbca04"
  description: "PR de contrato do pipeline (spec/tests, ORION-0030)"
