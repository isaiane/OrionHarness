name: flip-batch

# Automação de flip em lote do ledger (ADR-0033 / T10.2, #257 — fatia B2). ABRE o PR de flip
# `false->true` das entradas elegíveis-e-com-evidência sob a identidade do GitHub App; **NUNCA integra**
# (o merge é humano; a exclusão do merge é por branch ruleset da `main`, imposto porque o repo é público).
# Invariante: no máximo 1 lote aberto por vez. Só faz sentido com enforcement de ruleset — ver
# docs/runbooks/flip-app-install.md.
#
# GO-LIVE (ADR-0037, #257 fatia d): o gatilho é o FECHAMENTO `completed` de uma Issue; a agenda diária é a
# REDE DE SEGURANÇA (evento perdido); o dispatch manual segue disponível (sem janela de coalescência). Antes,
# em fatias da #257: (a) serialização + coalescência + lote manual preservado; (b) invalidação por reabertura +
# passo humano no merge; (c) monitor de liveness SEPARADO (`flip-liveness.yml`). Docs do split de owner: #259.

on:
  issues:
    types: [closed] # filtrado para `completed` no job (not_planned não abre lote)
  schedule:
    - cron: "23 5 * * *" # diária — antes da reconciliação do board (06:17) e do monitor de liveness (07:41)
  workflow_dispatch:

# Permissões do GITHUB_TOKEN automático = MÍNIMAS: todo write (checkout/push/PR/gh) usa o App token
# (steps.app) explicitamente — não expor uma 2ª identidade write-capable (Codex #267 L17).
permissions:
  contents: read

env:
  # Janela de coalescência W em horas (ADR-0037 §2) — config, não texto normativo. 20 h desde a #344 (Isa, G1):
  # um lote por dia — a agenda das 05:23 pega os fechamentos do dia (20 h, e não 24 h, para a rodada diária não
  # cair dentro da janela do lote anterior). Era 1 h. O dispatch manual ignora a janela.
  FLIP_COALESCE_HOURS: ${{ vars.FLIP_COALESCE_HOURS || '20' }}

jobs:
  flip-batch:
    name: flip-batch
    # Fechamento `not_planned` (ou sem motivo) não dispara rodada: só `completed` é sinal de conclusão (ADR-0037).
    if: github.event_name != 'issues' || github.event.issue.state_reason == 'completed'
    # SERIALIZAÇÃO (ADR-0037 §4(a)): TODOS os disparos (evento, agenda, dispatch) entram neste grupo ÚNICO, sem
    # cancel-in-progress; cada rodada lê o estado ao vivo dentro do trecho serializado. No nível do JOB (não do
    # workflow): um fechamento `not_planned` é pulado pelo `if` antes de entrar no grupo, então não substitui
    # na fila (o GitHub guarda 1 pendente por grupo) a rodada pendente de um fechamento `completed`.
    concurrency:
      group: flip-batch # GLOBAL (sem expressão) — 1 execução/lote por vez
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Token do GitHub App (identidade própria; sem poder de merge)
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Downscope: SÓ o que este workflow precisa (menor privilégio no token que persiste no checkout);
          # o App não precisa de Projects — o board usa o PROJECTS_TOKEN (ADR-0035/0036).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - uses: actions/checkout@v7
        with:
          ref: main # dispatch fixa o lote na main; nunca arrasta commits de outra branch (Codex #267 L40)
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*" # LTS ≥ 22.6 (type stripping)

      - name: 1 lote por vez — modo da rodada (lote do App × manual)
        id: guard
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Invariante GLOBAL "1 lote por vez" (ADR-0033) com a distinção do ADR-0037 §2 (Codex #304): PR flip/
          # MANUAL aberto ⇒ skip (nunca reescrever lote humano); UM lote do App (bot) aberto ⇒ update (recalcula
          # e atualiza esse PR, ou pula se nada mudou); nenhum ⇒ new (vale a janela de coalescência); 2+ lotes
          # do App ⇒ erro (fail-closed). Forks não contam (repo público). Teto do --limit: pelo invariante os
          # flip/ abertos são ~1, então 200 é folgado.
          prs=$(gh pr list --state open --base main --limit 200 \
            --json number,headRefName,isCrossRepository,author) \
            || { echo "::error::listagem de PRs abertos falhou — abortando (fail-closed)."; exit 1; }
          # Lote do App = autor EXATAMENTE `app/<slug>` deste App (não "qualquer bot" — Codex #304 r2).
          out=$(printf '%s' "$prs" | node --disable-warning=ExperimentalWarning --experimental-strip-types \
            tools/ledger/flip-batch.ts --batch-mode --app-login "app/$APP_SLUG")
          read -r mode pr_number pr_branch <<< "$out"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number:-}" >> "$GITHUB_OUTPUT"
          echo "pr_branch=${pr_branch:-}" >> "$GITHUB_OUTPUT"
          echo "::notice::modo da rodada: $out"

      - name: Janela de coalescência (só lote NOVO em rodada automática — ADR-0037 §2)
        id: coalesce
        if: steps.guard.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dispatch é ato humano: não passa pela janela. Evento/agenda só abrem lote novo se nenhum
          # PR flip/ (same-repo) foi aberto ou integrado nas últimas W horas.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "decision=open" >> "$GITHUB_OUTPUT"; echo "::notice::dispatch manual — sem janela de coalescência."; exit 0
          fi
          # Corte = agora − W. W inválido (não-número, ≤ 0) ⇒ o node falha ⇒ run VERMELHO (Codex #304).
          cutoff=$(node -e 'const h=Number(process.env.FLIP_COALESCE_HOURS); if(!(h>0)) { console.error(`FLIP_COALESCE_HOURS inválido: ${process.env.FLIP_COALESCE_HOURS}`); process.exit(2); } console.log(new Date(Date.now()-h*3600e3).toISOString().replace(/\.\d+Z$/,"Z"))')
          # PAGINADO por atualização (Codex #304): toda abertura/integração dentro da janela tem updated_at ≥
          # corte, então basta paginar até a página cujo item mais antigo é anterior ao corte. FAIL-CLOSED.
          stamps=""; page=1
          while :; do
            resp=$(gh api "repos/$REPO/pulls?state=all&sort=updated&direction=desc&per_page=100&page=$page") \
              || { echo "::error::listagem de PRs falhou — abortando (fail-closed)."; exit 1; }
            [ "$(printf '%s' "$resp" | jq 'length')" -eq 0 ] && break
            stamps+=$(printf '%s' "$resp" | jq -r --arg r "$REPO" \
              '.[] | select((.head.repo.full_name // "") == $r and (.head.ref | startswith("flip/")))
                    | .created_at, (.merged_at // empty)')$'\n'
            oldest=$(printf '%s' "$resp" | jq -r '.[-1].updated_at')
            [[ "$oldest" < "$cutoff" ]] && break
            page=$((page + 1))
          done
          decision=$(printf '%s' "$stamps" | node --disable-warning=ExperimentalWarning --experimental-strip-types \
            tools/ledger/flip-batch.ts --coalesce --window-hours "$FLIP_COALESCE_HOURS")
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          [ "$decision" = "open" ] || echo "::notice::Dentro da janela de coalescência (${FLIP_COALESCE_HOURS} h) — pulando; a próxima rodada após a janela pega o lote."

      - name: Projetar o lote elegível-e-com-evidência (flip-batch --apply)
        id: project
        if: steps.guard.outputs.mode == 'update' || (steps.guard.outputs.mode == 'new' && steps.coalesce.outputs.decision == 'open')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          bash scripts/flip-issues-json.sh > "$RUNNER_TEMP/issues.json"
          node --disable-warning=ExperimentalWarning --experimental-strip-types \
            tools/ledger/flip-batch.ts --issues-json "$RUNNER_TEMP/issues.json" --apply \
            --pr-body-out "$RUNNER_TEMP/pr-body.md"

      - name: Abrir o PR de flip (lote novo) — a automação NUNCA integra
        if: steps.guard.outputs.mode == 'new' && steps.coalesce.outputs.decision == 'open'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if git diff --quiet -- feature-ledger.json; then
            echo "::notice::Nada elegível-e-com-evidência — nenhum PR aberto."
            exit 0
          fi
          branch="flip/lote-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "orion-flip-bot"
          git config user.email "orion-flip-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add feature-ledger.json
          git commit -m "chore(ledger): flip em lote false->true (automação, ADR-0033)"
          git push origin "$branch"
          # Se o push foi ok mas o PR falhar (API/validação), NÃO deixar branch órfã sem PR — o guard só vê
          # PRs, então uma órfã acumularia lotes a cada dispatch (Codex #267 L87). Remove e falha (visível).
          if ! gh pr create --base main --head "$branch" \
            --title "chore(ledger): flip em lote (automação, ADR-0033)" \
            --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::error::gh pr create falhou — removendo a branch órfã $branch."
            git push origin --delete "$branch" || true
            exit 1
          fi

      - name: Atualizar o lote do App aberto (ou pular se nada mudou) — ADR-0037 §2
        if: steps.guard.outputs.mode == 'update'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.guard.outputs.pr_number }}
          PR_BRANCH: ${{ steps.guard.outputs.pr_branch }}
        run: |
          set -euo pipefail
          # O lote recalculado sobre a main ATUAL substitui o do PR do App: mesma branch, force-push, corpo
          # novo. "Nada mudou" = o ledger recalculado é idêntico ao da branch do PR ⇒ pula. Lote recalculado
          # VAZIO (evidência sumiu) ⇒ não mexe: o flip-revalidate do PR bloqueia o merge (fatia b).
          if git diff --quiet -- feature-ledger.json; then
            echo "::notice::Nada elegível agora — lote do App #$PR_NUMBER intocado (o flip-revalidate decide)."
            exit 0
          fi
          git fetch origin "$PR_BRANCH"
          if git diff --quiet "origin/$PR_BRANCH" -- feature-ledger.json; then
            # Nada mudou ⇒ NÃO toca no PR: reescrever o corpo desmarcaria a caixa do passo humano a cada
            # fechamento sem relação com o lote (Codex #318). Ressalva: se um `gh pr edit` anterior falhou após
            # o force-push, o corpo fica velho até o próximo lote mudar.
            echo "::notice::Lote do App #$PR_NUMBER já está em dia — PR intocado."
            exit 0
          fi
          git config user.name "orion-flip-bot"
          git config user.email "orion-flip-bot@users.noreply.github.com"
          git switch -c "$PR_BRANCH"
          git add feature-ledger.json
          git commit -m "chore(ledger): flip em lote false->true (automação, ADR-0033; lote atualizado)"
          git push --force origin "$PR_BRANCH"
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/pr-body.md"
          echo "::notice::Lote do App #$PR_NUMBER atualizado sobre a main atual."

      - name: Heartbeat (sempre; ausência = alarme — monitor externo é follow-up)
        if: always()
        run: |
          echo "flip-batch heartbeat: rodou em $(date -u +%FT%TZ) (mode=${{ steps.guard.outputs.mode }}, coalesce=${{ steps.coalesce.outputs.decision }})" \
            >> "$GITHUB_STEP_SUMMARY"
