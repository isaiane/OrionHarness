name: flip-invalidate

# Invalidação EVENT-DRIVEN do lote de flip (ADR-0037 §4(b)(i), #257 fatia b). Quando uma Issue DO LOTE reabre
# ou é (re)fechada (ex.: o motivo muda de `completed` para `not_planned`), re-roda o `flip-revalidate` do PR
# `flip/` aberto: a revalidação relê o estado VIVO da Issue e o check obrigatório fica VERMELHO enquanto alguma
# Issue do lote não estiver fechada como `completed` com o sinal de conclusão — o merge é bloqueado.
#
# ESTREITA a janela entre o último verde e o merge; NÃO a fecha (o handler pode rodar depois do merge, e o
# merge queue não existe em repo de conta de usuário). O resíduo é PROCEDURAL e declarado (ADR-0037 §4(b)(ii)):
# passo humano obrigatório no merge — ver docs/runbooks/flip-app-install.md §4.1.

on:
  issues:
    types: [reopened, closed]

# Lê código/PRs/runs e pede o re-run: nenhum write em conteúdo, nunca integra.
permissions:
  contents: read
  pull-requests: read
  actions: write # `gh run rerun` do flip-revalidate do PR de flip

concurrency:
  group: flip-invalidate
  cancel-in-progress: false

jobs:
  flip-invalidate:
    name: flip-invalidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # a lógica (batchIssues) vem da main
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*" # LTS ≥ 22.6 (type stripping)
      - name: Re-rodar o flip-revalidate dos PRs de flip cujo lote inclui a Issue do evento
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          # PRs flip/ abertos do PRÓPRIO repo (forks não contam). Pelo invariante "1 lote por vez" são ~1.
          # FAIL-CLOSED: falha de listagem ⇒ run vermelho (visível), não silêncio.
          prs=$(gh pr list --repo "$REPO" --state open --base main --limit 200 \
            --json number,headRefName,headRefOid,baseRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false and (.headRefName | startswith("flip/")))
                  | "\(.number) \(.headRefOid) \(.baseRefOid)"') \
            || { echo "::error::listagem de PRs flip/ falhou — abortando (fail-closed)."; exit 1; }
          if [ -z "$prs" ]; then
            echo "::notice::Issue #$ISSUE $ACTION — nenhum PR de flip aberto; nada a invalidar."; exit 0
          fi
          raw() { gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/feature-ledger.json?ref=$1"; }
          rc=0
          while read -r pr head base; do
            # Só age se a Issue do evento é DO LOTE (Codex #305): Issues das entradas que o PR flipa.
            if ! raw "$base" > "$RUNNER_TEMP/base.json" || ! raw "$head" > "$RUNNER_TEMP/head.json"; then
              echo "::error::não consegui ler o ledger base/head do PR #$pr."; rc=1; continue
            fi
            issues=$(node --disable-warning=ExperimentalWarning --experimental-strip-types \
              tools/ledger/flip-revalidate.ts --batch-issues "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json") \
              || { echo "::error::cálculo das Issues do lote do PR #$pr falhou."; rc=1; continue; }
            if ! grep -qx "$ISSUE" <<< "$issues"; then
              echo "::notice::Issue #$ISSUE não está no lote do PR #$pr — nada a invalidar."; continue
            fi
            # Run mais recente do flip-revalidate no HEAD do PR. Se ainda está rodando, ESPERA terminar (um run
            # em andamento não aceita re-run e pode ter lido o estado antigo — Codex #305) e então re-roda.
            run=$(gh run list --repo "$REPO" --workflow flip-revalidate.yml --commit "$head" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty') \
              || { echo "::error::listagem de runs do PR #$pr falhou."; rc=1; continue; }
            if [ -z "$run" ]; then
              echo "::error::PR de flip #$pr sem run do flip-revalidate no head $head — não dá para invalidar."; rc=1; continue
            fi
            status=$(gh run view "$run" --repo "$REPO" --json status --jq .status)
            if [ "$status" != "completed" ]; then
              echo "::notice::flip-revalidate do PR #$pr ainda em $status — aguardando terminar para re-rodar."
              gh run watch "$run" --repo "$REPO" > /dev/null || true
            fi
            gh run rerun "$run" --repo "$REPO" \
              && echo "::notice::Issue #$ISSUE $ACTION ⇒ re-run do flip-revalidate do PR #$pr (run $run)." \
              || { echo "::error::re-run do flip-revalidate do PR #$pr falhou."; rc=1; }
          done <<< "$prs"
          exit "$rc"
