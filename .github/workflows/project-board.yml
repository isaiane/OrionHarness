name: project-board

# Projeta o fluxo de execução no GitHub Project (T10.3 / O10, ADR-0033). O board é PROJEÇÃO DERIVADA
# de eventos, NUNCA fonte (ADR-0006/0026/0033): a fonte de status é a Issue SDD; este workflow só
# reflete. ESCRITOR ÚNICO (ADR-0033 escrita restrita ao projetor): este é o único caminho de escrita de Status — as
# automações NATIVAS de Status do Project ficam DESLIGADAS (segundo escritor sobrescreveria a projeção).
# Ver docs/runbooks/github-projects.md para o setup humano (criar campo Blocked, desligar as automações
# nativas, secret PROJECTS_TOKEN = PAT clássico com escopo `project` APENAS — ADR-0035/0036).
#
# O merge NUNCA é tocado (T3/G3 humano). Este workflow só move cartão — não integra, não comenta gate.

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request_target:
    # `edited` (#278): mudar o `Closes #N` do corpo recomputa as Issues do corpo ANTERIOR e do atual.
    types: [opened, reopened, closed, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  # Branch como sinal (#278 G): `<tipo>/<n>-<slug>` criada/apagada recomputa a Issue #n.
  create:
  delete:
  # Reconciliação PERIÓDICA (#278, incluída no G1): repara arrasto manual sem depender de dispatch.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: # reconciliação sob demanda (repara arrasto manual — ADR-0033 (escrita restrita ao projetor))
    inputs:
      dry_run:
        description: "Reconciliação NÃO-mutante: só reporta a coluna projetada, sem escrever no Project (Codex …7115)."
        type: boolean
        default: false

# GITHUB_TOKEN automático mínimo (checkout + leitura de PR no `resolve`); as chamadas que tocam o Project
# usam o PAT `PROJECTS_TOKEN` (o App de instalação não alcança Projects v2 de conta de usuário).
permissions:
  contents: read

# SERIALIZAÇÃO (#278 I): não há `concurrency` de workflow — o nº da Issue de um evento de PR/branch só é
# conhecido depois de resolvido. O job `resolve` deriva as Issues; o job `project` roda POR ISSUE (matrix)
# com `concurrency: board-issue-<n>` e lê o estado AO VIVO dentro do trecho serializado — um run atrasado
# escreve o estado atual, nunca um snapshot velho.

env:
  PROJECT_OWNER: isaiane
  PROJECT_NUMBER: "7"
  STATUS_FIELD: Status

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    # GATE DE ATIVAÇÃO (Codex …728133): desligado por padrão. Só roda depois que o setup humano DESLIGA as
    # automações nativas de Status e liga a variável de repo `PROJECT_BOARD_ENABLED=true` — senão, entre o
    # merge e o setup, o projetor e uma automação nativa seriam DOIS escritores. Ver runbook.
    # EXCEÇÃO (Codex …769137): um `workflow_dispatch` com `dry_run=true` passa mesmo com o gate desligado —
    # é NÃO-mutante e o runbook manda rodá-lo ANTES de ligar o gate. Runs mutantes/automáticos seguem gated.
    if: ${{ vars.PROJECT_BOARD_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
    # Só LÊ PR/Issue (GITHUB_TOKEN); nunca toca o Project — o PAT fica restrito ao job `project`.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # a lógica projetável vem sempre da main; o evento não arrasta código de branch

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*" # LTS >= 22.6 (type stripping)

      - name: Resolver a(s) Issue(s) afetada(s)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_ACTION: ${{ github.event.action }}
          # corpo ANTERIOR no `edited` — texto não-confiável: só via env, nunca interpolado no script.
          OLD_BODY: ${{ github.event.changes.body.from }}
          REF_TYPE: ${{ github.event.ref_type }}
          REF_NAME: ${{ github.event.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          proj() { node --disable-warning=ExperimentalWarning --experimental-strip-types tools/projects/board-projection.ts "$@"; }
          nums=""
          case "$EVENT_NAME" in
            issues)
              nums="$ISSUE_NUMBER" ;;
            pull_request_target)
              # FAIL-CLOSED (Codex …4055588594): falha do lookup ABORTA — não vira "não fecha Issue".
              if ! refs=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json closingIssuesReferences \
                --jq '.closingIssuesReferences[]
                      | select((.repository.owner.login + "/" + .repository.name | ascii_downcase) == ("'"$REPO"'" | ascii_downcase))
                      | .number' 2>/dev/null); then
                echo "::error::lookup de Issues do PR #$PR_NUMBER falhou — abortando (fail-closed)."; exit 1
              fi
              # só Issues do PRÓPRIO repo (Codex #296): `Closes other/repo#42` não projeta a #42 local.
              nums="$refs"
              # associação SEM `Closes #N` (#278 D): a branch `<tipo>/<n>-…` — só de PR do PRÓPRIO repo
              # (um fork não associa Issue por nome de branch).
              if [ "$PR_HEAD_REPO" = "$REPO" ]; then
                nums="$nums"$'\n'"$(proj --issue-from-branch "$PR_HEAD_REF")"
              fi
              # `edited`: recomputa também as Issues que o corpo ANTERIOR fechava.
              if [ "$PR_ACTION" = "edited" ] && [ -n "${OLD_BODY:-}" ]; then
                nums="$nums"$'\n'"$(printf '%s' "$OLD_BODY" | proj --closing-refs "$REPO")"
              fi ;;
            create|delete)
              [ "$REF_TYPE" = "branch" ] && nums="$(proj --issue-from-branch "$REF_NAME")" ;;
            schedule|workflow_dispatch)
              # RECONCILIAÇÃO sob o MESMO lock por Issue (#298): cada Issue vira um job `board-issue-<n>` — não há
              # escritor fora dos grupos por Issue. TODAS as Issues (abertas e fechadas — Codex #299: um cartão de
              # Issue fechada antiga arrastado à mão também é reparado). PAGINADO; o REST /issues inclui PRs —
              # filtra. FAIL-CLOSED: falha da listagem aborta (Codex …632797); acima do limite de 256 da matrix,
              # ERRO (não trunca em silêncio).
              nums=$(gh api --paginate "repos/$REPO/issues?state=all&per_page=100" \
                --jq '.[] | select(.pull_request|not) | .number') \
                || { echo "::error::listagem de Issues falhou — abortando reconciliação (fail-closed)."; exit 1; }
              echo "::notice::reconciliação ($EVENT_NAME) — todas as Issues" ;;
          esac
          targets=$(printf '%s\n' "$nums" | { grep -E '^[0-9]+$' || true; } | sort -un | jq -Rsc 'split("\n") | map(select(length>0))')
          count=$(jq 'length' <<< "$targets")
          if [ "$count" -gt 256 ]; then
            echo "::error::$count alvos passam do limite de 256 da matrix — abortando (fail-closed; dividir em lotes)."; exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "::notice::Issues afetadas ($count): $targets"

  project:
    name: project-board
    needs: resolve
    if: ${{ needs.resolve.outputs.targets != '' && needs.resolve.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    # Um escritor por Issue lógica por vez (#278 I) — eventos E reconciliação (#298). `cancel-in-progress:
    # false`: um run pendente mais novo SUBSTITUI o pendente velho — o que roda lê o estado vivo.
    concurrency:
      # dry-run em grupo PRÓPRIO (Codex #299): não pode substituir na fila um escritor pendente do mesmo item.
      group: board-issue-${{ matrix.target }}${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '-dry' || '' }}
      cancel-in-progress: false
    steps:
      # O board é USER-owned (Project 7 de `isaiane`); um installation-token de App NÃO alcança Projects v2
      # de conta de usuário (confirmado no deploy do T10.3 — flip-app-install.md). Usa-se um PAT do usuário
      # (`PROJECTS_TOKEN`) para as chamadas gh deste job. É um PAT clássico com escopo `project` APENAS
      # (sem `repo` → INCAPAZ de merge; reads de issues/PRs são públicos). Fine-grained não acessa Projects v2
      # de conta de usuário (ADR-0036, aceito — supersede o ponto 2/4 do ADR-0035). O checkout usa o
      # GITHUB_TOKEN padrão (contents:read, repo público).
      - uses: actions/checkout@v7
        with:
          ref: main # a lógica projetável vem sempre da main; o evento não arrasta código de branch

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*" # LTS >= 22.6 (type stripping)

      - name: Projetar o(s) item(ns) afetado(s)
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          TARGET: ${{ matrix.target }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          # PROJECTS_TOKEN ausente → projetor INATIVO (no-op verde), não quebra: a ativação é deliberada
          # (o setup humano liga o PAT + PROJECT_BOARD_ENABLED juntos — ver runbook).
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PROJECTS_TOKEN não configurado — projetor inativo (no-op). Ver runbook (setup humano)."
            exit 0
          fi

          # FAIL-CLOSED de escopo (ADR-0036 Conformidade): o token DEVE ser clássico `project`-ONLY. Usa
          # ALLOWLIST (não blacklist): rejeita QUALQUER escopo que não seja `project`/`read:project` — não só
          # `repo` (Codex #285). Assim, um secret re-rotacionado com `project`+`admin:org`/`delete_repo`/`gist`
          # também aborta. A descrição não garante o escopo; o header X-OAuth-Scopes (só de PAT clássico) garante.
          scopes=$(gh api -i /rate_limit 2>/dev/null | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="x-oauth-scopes"{print $2}')
          # escopos fora da allowlist {project, read:project} (entradas vazias removidas à parte):
          extra=$(printf '%s' "${scopes:-}" | tr ',' '\n' | sed 's/[[:space:]]//g' \
            | grep -vxE 'project|read:project' | grep -vx '' || true)
          if [ -n "$extra" ]; then
            echo "::error::PROJECTS_TOKEN tem escopo além de 'project' ($(printf '%s' "$extra" | tr '\n' ' ')) — abortando (ADR-0036 project-only). Scopes: ${scopes:-<vazio>}"; exit 1
          fi
          case ",$(printf '%s' "${scopes:-}" | tr -d ' ')," in
            *,project,*) echo "::notice::escopo do PROJECTS_TOKEN OK (project-only). Scopes: ${scopes:-<vazio>}";;
            *)
              echo "::error::PROJECTS_TOKEN sem escopo 'project' (ou não é PAT clássico — X-OAuth-Scopes vazio) — abortando. Scopes: ${scopes:-<vazio>}"; exit 1;;
          esac

          OWNER="${REPO%/*}"; NAME="${REPO#*/}"

          # --- IDs do Project (resolvidos em runtime; robusto a mudança de ID) ---
          proj=$(gh api graphql -f query='
            query($owner:String!, $num:Int!){ user(login:$owner){ projectV2(number:$num){
              id field(name:"'"$STATUS_FIELD"'"){ ... on ProjectV2SingleSelectField { id options { id name } } } } } }' \
            -f owner="$PROJECT_OWNER" -F num="$PROJECT_NUMBER")
          PROJECT_ID=$(echo "$proj" | jq -r '.data.user.projectV2.id')
          FIELD_ID=$(echo "$proj" | jq -r '.data.user.projectV2.field.id')
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "::error::Project $PROJECT_OWNER/#$PROJECT_NUMBER ou campo '$STATUS_FIELD' não resolvido."; exit 1
          fi
          echo "$proj" | jq -r '.data.user.projectV2.field.options[] | "\(.name)\t\(.id)"' > /tmp/opts.tsv

          option_id() { awk -F'\t' -v n="$1" '$1==n{print $2}' /tmp/opts.tsv; }

          # Contexto do repo lido UMA vez por job (#278): PRs ABERTOS do próprio repo (a branch liga o PR à
          # Issue sem `Closes #N`) e nomes de branch (sinal de In progress). FAIL-CLOSED: falha ⇒ aborta.
          open_prs=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == "'"$REPO"'")
                  | {state:"OPEN", merged:false, headRefName:.head.ref, labels:[.labels[].name], sameRepo:true}' | jq -sc .) \
            || { echo "::error::listagem de PRs abertos falhou — abortando (fail-closed)."; exit 1; }
          branches=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | jq -Rsc 'split("\n") | map(select(length>0))') \
            || { echo "::error::listagem de branches falhou — abortando (fail-closed)."; exit 1; }

          # Dados crus de uma Issue (RawTask) — a montagem/precedência vive em board-projection.ts (testada).
          build_raw() {
            local n="$1"
            # FAIL-CLOSED (Codex …7096/…683287): TODO lookup autoritativo que falhe emite __FAILED__ —
            # nunca vira estado vazio/"sem PR" que sobrescreveria In review/Ready.
            local iv; iv=$(gh issue view "$n" --repo "$REPO" --json state,stateReason,labels 2>/dev/null) || { echo "__FAILED__"; return; }
            local pr
            if ! pr=$(gh api graphql -f query='
              query($o:String!,$r:String!,$n:Int!){ repository(owner:$o,name:$r){ issue(number:$n){
                closedByPullRequestsReferences(first:100, includeClosedPrs:true){ nodes { state merged headRefName headRepository { nameWithOwner } labels(first:20){ nodes { name } } } } } } }' \
              -f o="$OWNER" -f r="$NAME" -F n="$n" 2>/dev/null); then
              echo "__FAILED__"; return
            fi
            echo "$iv" "$pr" | jq -sc --argjson n "$n" --arg repo "$REPO" --argjson open "$open_prs" --argjson br "$branches" '
              (.[0]) as $i |
              { issue: $n, issueState: $i.state, issueStateReason: $i.stateReason,
                labels: [ $i.labels[].name ],
                closingPrs: [ (.[1].data.repository.issue.closedByPullRequestsReferences.nodes // [])[]
                              | {state, merged, headRefName, labels: [ .labels.nodes[].name ],
                                sameRepo: ((.headRepository.nameWithOwner // "" | ascii_downcase) == ($repo | ascii_downcase))} ],
                openPrs: $open, branches: $br }' || echo "__FAILED__"
          }

          sync_issue() {
            local n="$1"
            local state; state=$(build_raw "$n")
            if [ "$state" = "__FAILED__" ]; then
              echo "::error::lookup autoritativo de #$n falhou — fail-closed (não sobrescreve o Status; run retryable)."; return 1
            fi
            [ -n "$state" ] || { echo "::notice::Issue #$n não lida — pulando."; return 0; }
            # FAIL-CLOSED explícito (Codex …728131): o chamador usa `sync_issue || rc=1`, o que DESLIGA o
            # `set -e` DENTRO desta função — então CADA operação falível checa e `return 1` por si (o
            # `pipefail` do run propaga a falha do meio do pipe ao `$?` que o `||` captura).
            local col
            col=$(echo "$state" | node --disable-warning=ExperimentalWarning --experimental-strip-types \
              tools/projects/board-projection.ts --raw | jq -r '.column') \
              || { echo "::error::projeção de #$n falhou (node/jq)."; return 1; }
            local opt; opt=$(option_id "$col")
            if [ -z "$opt" ]; then
              echo "::error::Coluna '$col' não existe no board (falta a opção do Status? ver runbook)."; return 1
            fi
            # Dry-run (Codex …7115): só reporta a projeção, sem NENHUMA mutação no Project.
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::notice::[dry-run] #$n → $col (nenhuma escrita)"; return 0
            fi
            # item da Issue no Project: REUSA o existente; só adiciona se ausente (Codex …632789 — não
            # depender de `add` idempotente sobre item já presente; o projetor é o único escritor, incl. add).
            local content_id
            content_id=$(gh issue view "$n" --repo "$REPO" --json id --jq .id) \
              || { echo "::error::content_id de #$n falhou."; return 1; }
            local item_id
            item_id=$(gh api graphql -f query='
              query($o:String!,$r:String!,$n:Int!){ repository(owner:$o,name:$r){ issue(number:$n){
                projectItems(first:100){ nodes { id project { id } } } } } }' \
              -f o="$OWNER" -f r="$NAME" -F n="$n" --jq '.data.repository.issue.projectItems.nodes[]' \
              | jq -r --arg p "$PROJECT_ID" 'select(.project.id==$p) | .id' | head -n1) \
              || { echo "::error::lookup de projectItem de #$n falhou."; return 1; }
            if [ -z "$item_id" ]; then
              item_id=$(gh api graphql -f query='
                mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p, contentId:$c}){ item { id } } }' \
                -f p="$PROJECT_ID" -f c="$content_id" --jq '.data.addProjectV2ItemById.item.id') \
                || { echo "::error::add do item de #$n falhou."; return 1; }
            fi
            gh api graphql -f query='
              mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){ updateProjectV2ItemFieldValue(input:{
                projectId:$p, itemId:$i, fieldId:$f, value:{ singleSelectOptionId:$o } }){ projectV2Item { id } } }' \
              -f p="$PROJECT_ID" -f i="$item_id" -f f="$FIELD_ID" -f o="$opt" >/dev/null \
              || { echo "::error::update de Status de #$n falhou."; return 1; }
            echo "::notice::#$n → $col"
            return 0
          }

          sync_issue "$TARGET" || rc=1
          exit "${rc:-0}"

      - name: Heartbeat
        if: always()
        run: |
          echo "project-board heartbeat: $(date -u +%FT%TZ) (event=${{ github.event_name }}, target=${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
